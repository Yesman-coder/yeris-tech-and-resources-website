<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Yeris Snake</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        touch-action: none;
      }
      canvas {
        display: block;
        cursor: pointer;
        max-width: 100%;
        max-height: 100vh;
      }

      /* ── On-screen controls ─────────────────────────────────────────────────── */
      #controls {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 14px 0 8px;
      }
      .drow { display: flex; gap: 6px; }
      .btn {
        width: 64px;
        height: 64px;
        background: transparent;
        border: 1px solid #006620;
        color: #00ff41;
        font-size: 22px;
        font-family: monospace;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        border-radius: 3px;
      }
      .btn:active, .btn.pressed {
        background: #002a0a;
        border-color: #00ff41;
        box-shadow: 0 0 10px rgba(0,255,65,0.35);
      }
      #btn-start {
        font-size: 9px;
        letter-spacing: 0.08em;
        color: #00ff41;
        border-color: #00ff41;
      }

      /* Show controls on touch screens or small viewports */
      @media (pointer: coarse), (max-width: 700px) {
        #controls { display: flex; }
        canvas { max-height: 56vh; }
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="controls">
      <div class="drow">
        <button class="btn" id="btn-up"   >▲</button>
      </div>
      <div class="drow">
        <button class="btn" id="btn-left" >◀</button>
        <button class="btn" id="btn-start">START</button>
        <button class="btn" id="btn-right">▶</button>
      </div>
      <div class="drow">
        <button class="btn" id="btn-down" >▼</button>
      </div>
    </div>

    <script>
      // ── Setup ─────────────────────────────────────────────────────────────────
      const c = document.getElementById('c');
      const g = c.getContext('2d');
      const CELL = 20, COLS = 32, ROWS = 22;
      c.width  = COLS * CELL; // 640
      c.height = ROWS * CELL; // 440
      const W = c.width, H = c.height;

      // ── Items to eat — Yeris themed ───────────────────────────────────────────
      const ITEMS = [
        { label: 'BUG',  color: '#ff4444', glow: '#cc0000', msg: '// bug.fix() ✓',        pts: 1 },
        { label: 'FEAT', color: '#00bfff', glow: '#0077cc', msg: '// feature.merge() ✓',  pts: 2 },
        { label: 'GOAL', color: '#ffb300', glow: '#cc7700', msg: '// milestone.hit() ✓',  pts: 3 },
        { label: 'SPRT', color: '#a855f7', glow: '#7700cc', msg: '// sprint.close() ✓',   pts: 4 },
        { label: 'PROJ', color: '#4f8ef7', glow: '#0044cc', msg: '// project.ship() ✓',   pts: 5 },
      ];

      const DEAD_MSGS = [
        [0,   0,        '// no deliverables today.'],
        [1,   5,        '// early stage. keep shipping.'],
        [6,   15,       '// MVP territory. not bad.'],
        [16,  30,       '// product-market fit detected.'],
        [31,  60,       '// series A energy.'],
        [61,  99,       '// acquisition incoming. probably.'],
        [100, Infinity, '// you are the product now.'],
      ];

      function deadMsg(s) {
        const row = DEAD_MSGS.find(([lo, hi]) => s >= lo && s <= hi);
        return (row || DEAD_MSGS[1])[2];
      }

      // ── State ─────────────────────────────────────────────────────────────────
      let snake, dir, nextDir, food, score, eaten, state, flash, flashEnd, speed, acc, prevTs;

      function startGame() {
        if (state !== 'playing') { init(); state = 'playing'; }
      }

      function init() {
        snake   = [{x:14,y:11},{x:13,y:11},{x:12,y:11}];
        dir     = {x:1, y:0};
        nextDir = {x:1, y:0};
        score   = 0;
        eaten   = 0;
        state   = 'idle';
        flash   = null;
        flashEnd = 0;
        speed   = 140;
        acc     = 0;
        prevTs  = null;
        spawnFood();
      }

      function spawnFood() {
        const item = ITEMS[Math.floor(Math.random() * ITEMS.length)];
        let p;
        do {
          p = { x: Math.random() * COLS | 0, y: Math.random() * ROWS | 0 };
        } while (snake.some(s => s.x === p.x && s.y === p.y));
        food = { ...p, ...item };
      }

      function step() {
        dir = { ...nextDir };
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
          state = 'dead'; return;
        }
        if (snake.some(s => s.x === head.x && s.y === head.y)) {
          state = 'dead'; return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score   += food.pts;
          eaten++;
          flash    = food;
          flashEnd = performance.now() + 1400;
          speed    = Math.max(65, 140 - eaten * 4);
          spawnFood();
        } else {
          snake.pop();
        }
      }

      // ── Draw helpers ──────────────────────────────────────────────────────────
      function gl(col, blur)  { g.shadowColor = col; g.shadowBlur = blur; }
      function nogl()         { g.shadowBlur = 0; }

      function txt(text, color, size, x, y, align, baseline, glowCol, glowBlur) {
        g.fillStyle    = color;
        g.font         = `bold ${size}px 'Courier New', monospace`;
        g.textAlign    = align    || 'center';
        g.textBaseline = baseline || 'middle';
        if (glowCol) gl(glowCol, glowBlur || 10);
        g.fillText(text, x, y);
        nogl();
      }

      function overlay(alpha) {
        g.fillStyle = `rgba(0,0,0,${alpha})`;
        g.fillRect(0, 0, W, H);
      }

      // ── Render ────────────────────────────────────────────────────────────────
      function draw(now) {
        g.fillStyle = '#000';
        g.fillRect(0, 0, W, H);

        g.strokeStyle = '#0a150a';
        g.lineWidth   = 0.5;
        for (let x = 0; x <= COLS; x++) {
          g.beginPath(); g.moveTo(x * CELL + .5, 0); g.lineTo(x * CELL + .5, H); g.stroke();
        }
        for (let y = 0; y <= ROWS; y++) {
          g.beginPath(); g.moveTo(0, y * CELL + .5); g.lineTo(W, y * CELL + .5); g.stroke();
        }

        gl('#00ff41', 16);
        g.strokeStyle = '#00ff41';
        g.lineWidth = 2;
        g.strokeRect(1, 1, W - 2, H - 2);
        nogl();

        gl(food.glow, 14);
        g.fillStyle = food.color;
        g.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
        nogl();
        g.fillStyle    = '#000';
        g.font         = 'bold 7px "Courier New"';
        g.textAlign    = 'center';
        g.textBaseline = 'middle';
        g.fillText(food.label, food.x * CELL + CELL / 2, food.y * CELL + CELL / 2);

        for (let i = snake.length - 1; i >= 0; i--) {
          const seg = snake[i];
          if (i === 0) {
            gl('#e0ffe8', 18);
            g.fillStyle = '#e0ffe8';
            g.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
            nogl();
          } else {
            const a = Math.max(0.15, 1 - (i / snake.length) * 0.88);
            g.fillStyle = `rgba(0,255,65,${a.toFixed(2)})`;
            gl(`rgba(0,200,50,${(a * 0.4).toFixed(2)})`, 5);
            g.fillRect(seg.x * CELL + 2, seg.y * CELL + 2, CELL - 4, CELL - 4);
            nogl();
          }
        }

        txt(`score: ${score}`, '#00ff41', 11, 8, 7, 'left', 'top', '#00ff41', 5);
        txt(`${eaten} shipped`, '#004d13', 10, W - 8, 7, 'right', 'top');

        if (flash && now < flashEnd) {
          const t = (flashEnd - now) / 1400;
          g.globalAlpha = t < 0.3 ? t / 0.3 : 1;
          txt(flash.msg, flash.color, 13, W / 2, H / 2 - CELL * 4, 'center', 'middle', flash.glow, 12);
          g.globalAlpha = 1;
        }

        if (state === 'idle') {
          overlay(1);
          txt('YERIS SNAKE',                         '#00ff41', 30, W/2, H/2 - 52, 'center', 'middle', '#00ff41', 18);
          txt('// eat bugs, features & projects',    '#006620', 13, W/2, H/2 - 8);
          txt('// arrow keys · WASD · d-pad',        '#004d13', 12, W/2, H/2 + 16);
          txt('// tap START or press SPACE',          '#00ff41', 13, W/2, H/2 + 44);
        }

        if (state === 'dead') {
          overlay(1);
          txt('// process.exit(1)',                  '#ff4444', 24, W/2, H/2 - 52, 'center', 'middle', '#ff0000', 14);
          txt(deadMsg(score),                        '#00ff41', 14, W/2, H/2 - 8);
          txt(`// ${score} units delivered`,         '#006620', 12, W/2, H/2 + 16);
          txt('// tap START or press SPACE',         '#004d13', 12, W/2, H/2 + 44);
        }
      }

      // ── Game loop ─────────────────────────────────────────────────────────────
      function tick(ts) {
        const delta = prevTs ? ts - prevTs : 0;
        prevTs = ts;

        if (state === 'playing') {
          acc += delta;
          while (acc >= speed && state === 'playing') {
            acc -= speed;
            step();
          }
        }

        draw(ts);
        requestAnimationFrame(tick);
      }

      // ── Keyboard input ────────────────────────────────────────────────────────
      const DMAP = {
        ArrowUp:    {x:0,  y:-1},
        ArrowDown:  {x:0,  y:1},
        ArrowLeft:  {x:-1, y:0},
        ArrowRight: {x:1,  y:0},
        w: {x:0,  y:-1},
        s: {x:0,  y:1},
        a: {x:-1, y:0},
        d: {x:1,  y:0},
      };

      document.addEventListener('keydown', e => {
        if (e.key === ' ') {
          e.preventDefault();
          startGame();
          return;
        }
        if (state !== 'playing') return;
        const d = DMAP[e.key] || DMAP[e.key.toLowerCase()];
        if (!d) return;
        e.preventDefault();
        if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
      });

      // ── Canvas tap — start / restart ──────────────────────────────────────────
      c.addEventListener('pointerup', e => {
        e.preventDefault();
        startGame();
      });

      // ── On-screen D-pad ───────────────────────────────────────────────────────
      function dpadDir(dx, dy) {
        if (state !== 'playing') return;
        const d = {x: dx, y: dy};
        if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
      }

      function holdButton(el, dx, dy) {
        let interval = null;
        function press() {
          dpadDir(dx, dy);
          el.classList.add('pressed');
          // held direction: repeat every 80ms
          interval = setInterval(() => dpadDir(dx, dy), 80);
        }
        function release() {
          el.classList.remove('pressed');
          clearInterval(interval);
          interval = null;
        }
        el.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
        el.addEventListener('pointerup',   e => { e.preventDefault(); release(); });
        el.addEventListener('pointerleave', release);
        el.addEventListener('pointercancel', release);
      }

      holdButton(document.getElementById('btn-up'),    0, -1);
      holdButton(document.getElementById('btn-down'),  0,  1);
      holdButton(document.getElementById('btn-left'), -1,  0);
      holdButton(document.getElementById('btn-right'), 1,  0);

      document.getElementById('btn-start').addEventListener('pointerup', e => {
        e.preventDefault();
        startGame();
      });

      // ── Swipe on canvas ───────────────────────────────────────────────────────
      let swipeStart = null;
      c.addEventListener('pointerdown', e => {
        swipeStart = { x: e.clientX, y: e.clientY };
      });
      c.addEventListener('pointermove', e => {
        if (!swipeStart || state !== 'playing') return;
        const dx = e.clientX - swipeStart.x;
        const dy = e.clientY - swipeStart.y;
        if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
        const d = Math.abs(dx) > Math.abs(dy)
          ? { x: dx > 0 ? 1 : -1, y: 0 }
          : { x: 0, y: dy > 0 ? 1 : -1 };
        if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
        swipeStart = { x: e.clientX, y: e.clientY };
      });
      c.addEventListener('pointercancel', () => { swipeStart = null; });

      // ── Boot ──────────────────────────────────────────────────────────────────
      init();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
